<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Cephroid Shark Tank – Contestant Team Login Portal" />
  <title>Team Login | CEBROID 2k26 – Shark Tank</title>
  <!-- Fonts loaded via style.css @import -->
  <link rel="stylesheet" href="style.css" />
</head>
<body class="login-body contestant-theme">

  <!-- Animated background orbs -->
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div class="bg-orb orb-3"></div>

  <main class="login-container" role="main">

    <!-- Logo / Branding -->
    <header class="login-header">
      <div class="logo-wrap" aria-label="CEBROID 2k26 Shark Tank Logo">
        <div class="logo-icon">
          <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" width="60" height="60">
            <defs>
              <linearGradient id="sigilGrad2" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
                <stop stop-color="#C41E1E"/><stop offset="1" stop-color="#D4500A"/>
              </linearGradient>
            </defs>
            <path d="M32 4 L56 14 L56 36 Q56 52 32 60 Q8 52 8 36 L8 14 Z" stroke="url(#sigilGrad2)" stroke-width="2" fill="rgba(196,30,30,0.12)"/>
            <line x1="20" y1="20" x2="44" y2="44" stroke="url(#sigilGrad2)" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="44" y1="20" x2="20" y2="44" stroke="url(#sigilGrad2)" stroke-width="2.5" stroke-linecap="round"/>
            <circle cx="32" cy="14" r="2.5" fill="url(#sigilGrad2)"/>
            <circle cx="24" cy="18" r="2" fill="url(#sigilGrad2)"/>
            <circle cx="40" cy="18" r="2" fill="url(#sigilGrad2)"/>
          </svg>
        </div>
        <div class="logo-text">
          <span class="logo-title">CEBROID</span>
          <span class="logo-sub">Shark Tank · 2K26</span>
        </div>
      </div>
      <h1 class="login-heading">The Contenders' Hall</h1>
      <p class="login-subheading">For Project Teams &amp; Makers</p>
    </header>

    <!-- Login Card -->
    <section class="login-card" aria-label="Team Login Form">
      <form id="loginForm" class="login-form" novalidate>

        <!-- Team Email Field -->
        <div class="form-group" id="emailGroup">
          <label for="emailInput" class="form-label">Team Email Address</label>
          <div class="input-wrap">
            <span class="input-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="M2 7l10 7 10-7"/></svg>
            </span>
            <input
              type="email"
              id="emailInput"
              name="email"
              class="form-input"
              placeholder="team@example.com"
              autocomplete="email"
              required
              aria-required="true"
              aria-describedby="emailError"
            />
          </div>
          <span class="field-error" id="emailError" role="alert" aria-live="polite"></span>
        </div>

        <!-- Password / PIN Field -->
        <div class="form-group" id="passwordGroup">
          <label for="passwordInput" class="form-label">Team Password / PIN</label>
          <div class="input-wrap">
            <span class="input-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
            </span>
            <input
              type="password"
              id="passwordInput"
              name="password"
              class="form-input"
              placeholder="Enter your team PIN"
              autocomplete="current-password"
              required
              aria-required="true"
              aria-describedby="passwordError"
            />
            <button type="button" id="togglePassword" class="toggle-pass-btn" aria-label="Toggle password visibility">
              <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <span class="field-error" id="passwordError" role="alert" aria-live="polite"></span>
        </div>

        <!-- Global Error Banner -->
        <div class="auth-error" id="authError" role="alert" aria-live="assertive" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <span id="authErrorMsg">Invalid credentials. Please try again.</span>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="loginBtn" class="btn-primary" aria-label="Login to Contestant Portal">
          <span class="btn-text">Access Dashboard</span>
          <span class="btn-spinner" hidden aria-hidden="true"></span>
        </button>

      </form>
    </section>

    <footer class="login-footer">
      <p>CEBROID 2K26 &bull; Powered by ACET</p>
    </footer>

  </main>

  <script src="app.js"></script>
</body>
</html>
