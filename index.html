<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Cephroid Shark Tank – Contestant Team Login Portal" />
  <title>Team Login | Cephroid Shark Tank</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="login-body contestant-theme">

  <!-- Animated background orbs -->
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div class="bg-orb orb-3"></div>

  <main class="login-container" role="main">

    <!-- Logo / Branding -->
    <header class="login-header">
      <div class="logo-wrap" aria-label="Cephroid Shark Tank Logo">
        <div class="logo-icon">
          <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M32 4L58 18V46L32 60L6 46V18L32 4Z" stroke="url(#hexGrad2)" stroke-width="2.5" fill="none"/>
            <path d="M32 14L50 24V44L32 54L14 44V24L32 14Z" fill="url(#hexFill2)" opacity="0.3"/>
            <text x="50%" y="56%" dominant-baseline="middle" text-anchor="middle" font-size="22" font-weight="800" fill="url(#textGrad2)" font-family="Outfit, sans-serif">ST</text>
            <defs>
              <linearGradient id="hexGrad2" x1="6" y1="4" x2="58" y2="60" gradientUnits="userSpaceOnUse">
                <stop stop-color="#00D4FF"/>
                <stop offset="1" stop-color="#7B2FFF"/>
              </linearGradient>
              <linearGradient id="hexFill2" x1="14" y1="14" x2="50" y2="54" gradientUnits="userSpaceOnUse">
                <stop stop-color="#00D4FF"/>
                <stop offset="1" stop-color="#7B2FFF"/>
              </linearGradient>
              <linearGradient id="textGrad2" x1="14" y1="28" x2="50" y2="44" gradientUnits="userSpaceOnUse">
                <stop stop-color="#00D4FF"/>
                <stop offset="1" stop-color="#7B2FFF"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <div class="logo-text">
          <span class="logo-title">CEPHROID</span>
          <span class="logo-sub">SHARK TANK</span>
        </div>
      </div>
      <h1 class="login-heading">Contestant Portal</h1>
      <p class="login-subheading">For Project Teams &amp; Makers</p>
    </header>

    <!-- Login Card -->
    <section class="login-card" aria-label="Team Login Form">
      <form id="loginForm" class="login-form" novalidate>

        <!-- Team Email Field -->
        <div class="form-group" id="emailGroup">
          <label for="emailInput" class="form-label">Team Email Address</label>
          <div class="input-wrap">
            <span class="input-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="M2 7l10 7 10-7"/></svg>
            </span>
            <input
              type="email"
              id="emailInput"
              name="email"
              class="form-input"
              placeholder="team@example.com"
              autocomplete="email"
              required
              aria-required="true"
              aria-describedby="emailError"
            />
          </div>
          <span class="field-error" id="emailError" role="alert" aria-live="polite"></span>
        </div>

        <!-- Password / PIN Field -->
        <div class="form-group" id="passwordGroup">
          <label for="passwordInput" class="form-label">Team Password / PIN</label>
          <div class="input-wrap">
            <span class="input-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
            </span>
            <input
              type="password"
              id="passwordInput"
              name="password"
              class="form-input"
              placeholder="Enter your team PIN"
              autocomplete="current-password"
              required
              aria-required="true"
              aria-describedby="passwordError"
            />
            <button type="button" id="togglePassword" class="toggle-pass-btn" aria-label="Toggle password visibility">
              <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <span class="field-error" id="passwordError" role="alert" aria-live="polite"></span>
        </div>

        <!-- Global Error Banner -->
        <div class="auth-error" id="authError" role="alert" aria-live="assertive" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <span id="authErrorMsg">Invalid credentials. Please try again.</span>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="loginBtn" class="btn-primary" aria-label="Login to Contestant Portal">
          <span class="btn-text">Access Dashboard</span>
          <span class="btn-spinner" hidden aria-hidden="true"></span>
        </button>

      </form>
    </section>

    <footer class="login-footer">
      <p>Cephroid 2K26 &bull; Powered by ACET</p>
    </footer>

  </main>

  <script src="app.js"></script>
</body>
</html>
